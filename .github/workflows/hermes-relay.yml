name: Hermes Relay

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write # Record verified publication; prevents inactivity suspension.

concurrency:
  group: hermes-relay-daily-publication
  cancel-in-progress: false

jobs:
  hermes-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPPOSITE_OSIRIS_PAT: ${{ secrets.OPPOSITE_OSIRIS_PAT }}
      BLOG_BASE_URL: https://www.tonymuzo.dev

    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          python3 - <<'PY'
          import os
          required = ('GCP_SA_KEY', 'GOOGLE_CLOUD_PROJECT', 'OPPOSITE_OSIRIS_PAT')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing required configuration: ' + ', '.join(missing))
          print('Required configuration is present (values not displayed).')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Checkout opposite-osiris blog repo
        uses: actions/checkout@v4
        with:
          repository: r0cstar09/opposite-osiris
          token: ${{ secrets.OPPOSITE_OSIRIS_PAT }}
          path: opposite-osiris-site

      - name: Check for an already-published edition
        id: edition
        run: python verify_publication.py preflight --site-dir opposite-osiris-site

      - name: Authenticate to Google Cloud
        if: steps.edition.outputs.already_published != 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node for opposite-osiris
        if: steps.edition.outputs.already_published != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: opposite-osiris-site/package-lock.json

      - name: Install opposite-osiris dependencies
        if: steps.edition.outputs.already_published != 'true'
        working-directory: opposite-osiris-site
        run: npm ci

      - name: Restore SQLite persistence cache
        id: history
        if: steps.edition.outputs.already_published != 'true'
        uses: actions/cache/restore@v4
        with:
          path: hermes_relay.db
          key: hermes-relay-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hermes-relay-db-

      - name: Collect and prepare today's briefing
        if: steps.edition.outputs.already_published != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
          VERTEX_MODEL: ${{ secrets.VERTEX_MODEL || 'gemini-2.5-flash' }}
          VERTEX_MODEL_RESOURCE: ${{ secrets.VERTEX_MODEL_RESOURCE }}
          HERMES_RELAY_DB: hermes_relay.db
          # Website repair does not re-enable the separate email digest.
          ICLOUD_EMAIL: ''
          ICLOUD_PASSWORD: ''
          EMAIL_RECIPIENT: ''
        run: python orchestrator.py

      - name: Publish top story to opposite-osiris blog
        if: steps.edition.outputs.already_published != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
          VERTEX_MODEL: ${{ secrets.VERTEX_MODEL || 'gemini-2.5-flash' }}
          VERTEX_MODEL_RESOURCE: ${{ secrets.VERTEX_MODEL_RESOURCE }}
          VERTEX_BLOG_EDITOR_MODEL: ${{ secrets.VERTEX_BLOG_EDITOR_MODEL || 'gemini-2.5-pro,gemini-2.5-flash' }}
          VERTEX_BLOG_IMAGE_MODEL: ${{ secrets.VERTEX_BLOG_IMAGE_MODEL || 'imagen-4.0-generate-001' }}
        run: |
          git -C opposite-osiris-site config user.name "Tony Muzo"
          git -C opposite-osiris-site config user.email "211059789+r0cstar09@users.noreply.github.com"
          today=$(date -u +%F)
          briefing_json="json_output/${today}/hermes_llm_top3_${today}.json"
          signal_json="hermes_signal_${today}.json"
          test -s "${briefing_json}"
          test -s "${signal_json}"
          python publish_blog_post.py \
            --briefing-json "${briefing_json}" \
            --signal-json "${signal_json}" \
            --site-dir opposite-osiris-site \
            --editor-model "${VERTEX_BLOG_EDITOR_MODEL}" \
            --image-model "${VERTEX_BLOG_IMAGE_MODEL}" \
            --voice-profile prompts/tony_voice.md \
            --verify-build --commit --push

      - name: Verify the live article and hero image
        run: python verify_publication.py verify --site-dir opposite-osiris-site --base-url "${BLOG_BASE_URL}" --receipt publication-status.json

      - name: Record verified publication and keep the schedule active
        run: |
          git config user.name "Tony Muzo"
          git config user.email "211059789+r0cstar09@users.noreply.github.com"
          git add -- publication-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record verified daily blog publication [skip ci]"
            git push origin HEAD:main
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('publication-status.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"## Published and live-verified\n[{receipt['title']}]({receipt['url']})\n")
          PY

      - name: Save SQLite persistence after verified publication
        if: success() && steps.edition.outputs.already_published != 'true'
        uses: actions/cache/save@v4
        with:
          path: hermes_relay.db
          key: hermes-relay-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve diagnostics even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-relay-output
          path: |
            hermes_relay.db
            hermes_signal_*.json
            json_output/
            publication-status.json
          retention-days: 30
